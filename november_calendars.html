<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>November Calendars</title>
<style>
  :root {
    --bg: #0f1020;
    --text: #f5f3ff;
    --muted: #a7a5c4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 500px at 10% -10%, rgba(255,107,107,.28), transparent 60%),
      radial-gradient(800px 500px at 100% 10%, rgba(255,92,170,.25), transparent 60%),
      radial-gradient(900px 600px at 50% 120%, rgba(110,80,255,.30), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    padding: 56px 16px 72px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 40px; }
  .eyebrow {
    display: inline-block;
    font-size: .75rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted);
    padding: 6px 14px; border-radius: 999px;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
  }
  h1 {
    font-size: clamp(2.2rem, 7vw, 3.6rem);
    margin: 16px 0 8px; line-height: 1.05; letter-spacing: -.02em;
    background: linear-gradient(90deg, #ffb36b, #ff6b9d 50%, #a78bfa);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { margin: 0; color: var(--muted); }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
  .card {
    --c1: #ff8a5c; --c2: #ff4d8d;
    position: relative; display: flex; flex-direction: column; justify-content: space-between;
    min-height: 220px; padding: 24px; overflow: hidden;
    text-decoration: none; color: var(--text);
    border-radius: 22px;
    background: linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    backdrop-filter: blur(8px);
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .card::before {
    content: ""; position: absolute; inset: 0; z-index: 0; opacity: .0;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    transition: opacity .25s ease;
  }
  .card::after {
    content: ""; position: absolute; width: 180px; height: 180px; right: -60px; top: -60px; z-index: 0;
    border-radius: 50%; background: linear-gradient(135deg, var(--c1), var(--c2)); opacity: .55; filter: blur(2px);
    transition: transform .35s ease;
  }
  .card > * { position: relative; z-index: 1; }
  .card:hover { transform: translateY(-6px); border-color: rgba(255,255,255,.35); box-shadow: 0 18px 40px rgba(0,0,0,.45); }
  .card:hover::before { opacity: .28; }
  .card:hover::after { transform: scale(1.25); }
  .card:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  .icon {
    width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center;
    font-size: 1.7rem;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
  }
  .card h2 { margin: 18px 0 4px; font-size: 1.5rem; letter-spacing: -.01em; }
  .card .sub { color: var(--muted); font-size: .9rem; }
  .open {
    margin-top: 18px; font-weight: 700; font-size: .9rem;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .open span { display: inline-block; transition: transform .25s ease; }
  .card:hover .open span { transform: translateX(6px); }

  .meaty { --c1: #ff6a4d; --c2: #ffb02e; }
  .tiff  { --c1: #ff5fa2; --c2: #b47bff; }
  .wise  { --c1: #3ecf8e; --c2: #3b82f6; }

  @media (prefers-reduced-motion: reduce) { .card, .card::after, .open span { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">Content Planner</span>
    <h1>November Calendars</h1>
    <p>Pick a campaign to open its posting calendar.</p>
  </header>

  <main class="grid">
    <a class="card meaty" href="campaigns/mr-meaty/mr_meaty_november_calendar.html">
      <div>
        <div class="icon">🍖</div>
        <h2>Mr. Meaty</h2>
        <div class="sub">November posting schedule</div>
      </div>
      <div class="open">Open calendar <span>→</span></div>
    </a>

    <a class="card tiff" href="campaigns/Tiff/tiff_november_calendar.html">
      <div>
        <div class="icon">💖</div>
        <h2>Tiff</h2>
        <div class="sub">November posting schedule</div>
      </div>
      <div class="open">Open calendar <span>→</span></div>
    </a>

    <a class="card wise" href="campaigns/wise-guy/wise_guy_november_calendar.html">
      <div>
        <div class="icon">🧠</div>
        <h2>Wise Guy</h2>
        <div class="sub">November posting schedule</div>
      </div>
      <div class="open">Open calendar <span>→</span></div>
    </a>
  </main>
</div>
</body>
</html>
